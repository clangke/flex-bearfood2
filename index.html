<script>
const targetUrl = "https://track.flexlinkspro.com/g.ashx?foid=24.247835.6671455&trid=1508723.247835&foc=16&fot=9999&fos=6";
const image = document.getElementById("promo-image");
const status = document.getElementById("redirect-status");
let started = false;
async function startCountdown() {
  if (started || !image.naturalWidth) return;
  started = true;
  try { await image.decode(); } catch (_) {}
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.body.classList.add("ready");
    let time = 3;
    status.textContent = "Taking you to Omax Health in 3 seconds";
    const timer = setInterval(() => {
      time--;
      status.textContent = "Taking you to Omax Health in " + Math.max(time, 0) + " seconds";
      if (time <= 0) {
        clearInterval(timer);
        window.location.href = targetUrl;
      }
    }, 1000);
  }));
}
image.addEventListener("load", startCountdown, { once: true });
image.addEventListener("error", () => {
  status.textContent = "Image unavailable. Use Unlock My Offer to continue.";
}, { once: true });
if (image.complete && image.naturalWidth) startCountdown();
</script>
